<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SpotMyShoot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body style="background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);">
  <header class="header"></header>

  <div class="container" style="max-width: 440px; padding-top: 60px; padding-bottom: 80px;">
    <div style="background: white; border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 32px; margin-bottom: 8px;">🔑</div>
        <h1 style="font-size: 24px; font-weight: 800;" id="reset-page-title">Reset Your Password</h1>
        <p style="color: var(--text-muted); font-size: 14px;" id="reset-page-desc">Enter your registered email to receive recovery instructions</p>
      </div>

      <!-- Step 1: Request Email -->
      <form id="forgot-form" onsubmit="handleForgot(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="forgot-email" class="form-control" required placeholder="you@example.com" autofocus>
        </div>

        <button type="submit" id="btn-forgot" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Send Reset Link &rarr;
        </button>
      </form>

      <!-- Step 2: Enter New Password (If Token Provided) -->
      <form id="newpass-form" style="display: none;" onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label class="form-label">New Password (Min 6 characters)</label>
          <input type="password" id="new-password" class="form-control" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" id="btn-reset" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Set New Password &rarr;
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 14px;">
        <a href="/login.html" style="color: var(--primary); font-weight: 600;">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    let resetToken = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      resetToken = params.get('token');

      if (resetToken) {
        document.getElementById('forgot-form').style.display = 'none';
        document.getElementById('newpass-form').style.display = 'block';
        document.getElementById('reset-page-title').innerText = 'Set New Password';
        document.getElementById('reset-page-desc').innerText = 'Enter your new secure password below';
      }
    });

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.getElementById('btn-forgot');
      btn.disabled = true;
      btn.innerText = 'Sending...';

      try {
        const res = await apiFetch('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showToast(res.message, 'success');
        document.getElementById('forgot-email').value = '';
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Send Reset Link →';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;

      if (p1 !== p2) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('btn-reset');
      btn.disabled = true;
      btn.innerText = 'Updating password...';

      try {
        const res = await apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token: resetToken, new_password: p1 })
        });
        showToast(res.message, 'success');
        setTimeout(() => window.location.href = '/login.html', 1200);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Set New Password →';
      }
    }
  </script>
</body>
</html>
