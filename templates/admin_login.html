{% extends "base.html" %}

{% block title %}Admin Login — {{ config.BUSINESS_NAME }}{% endblock %}

{% block content %}
<div style="max-width:440px; margin:2rem auto;">
  <div class="form-card">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <span class="mark" style="background:#2563eb; color:#ffffff; width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:1.25rem; margin-bottom:0.75rem;">◎</span>
      <h2 style="font-size:1.5rem;">Admin Sign In</h2>
      <p style="color:#64748b; font-size:0.9rem;">Sign in to manage slots, bookings, and revenue.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:0.75rem; margin-bottom:1.25rem; font-size:0.8rem; color:#64748b;">
        Default Credentials (from <code>.env</code>):<br>
        Username: <strong>admin</strong> | Password: <strong>admin123</strong>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding:0.75rem;">Sign In to Dashboard →</button>
    </form>
  </div>
</div>
{% endblock %}
